name = "starry-file-upload"
main = "worker.js"
compatibility_date = "2026-10-01"

# 非敏感变量（Secret 用 `wrangler secret put` 或 Dashboard 设置，绝不写在这里）
[vars]
# 允许上传的 GitHub 用户名——Worker 会向 GitHub 核实令牌属于谁
ALLOWED_GITHUB_LOGIN = "Starryeeeeee"
# 允许发起上传请求的来源（逗号分隔）
ALLOWED_ORIGINS = "https://starryeeeeee.github.io,http://localhost:4321,http://127.0.0.1:4321"
# R2 桶的公开访问地址：建好桶并开启公开访问后填这里（控制台 → R2 → 该桶 → Public domain）
R2_PUBLIC_BASE = "https://files.你的子域.r2.dev"
# 体积上限（字节）：知识库 40MB，画廊 12MB
MAX_KB_BYTES = "41943040"
MAX_GALLERY_BYTES = "12582912"
# 每 IP 每小时请求数
RATE_PER_HOUR = "60"

# R2 桶绑定：凭证由 Cloudflare 平台注入，代码与配置里都没有密钥
[[r2_buckets]]
binding = "FILES"
bucket_name = "starry-files"
preview_bucket_name = "starry-files-preview"
