# 星野漫游 · GitHub Pages 部署工作流
# 触发：推送 main / 手动 / 废话条 Issue 变动（手机发动态自动上站的关键）
# 首次使用前需要在仓库设置里打开一次：Settings → Pages → Source 选 "GitHub Actions"
#
# 2026-11-13：加了两道自检。起因是 Pages 的发布来源被改成「从分支发布」，
# 代码全绿、构建全绿，只有访客那端是 404，隔了 4 天才被发现。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read   # 构建时拉取带 moment 标签的 Issue（废话条数据源）
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # CI 自动提供的令牌：用它拉 Issue 不受匿名 60 次/小时的限额
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 写进 <meta name="sr-build">，发布后自检靠它对账线上版本
          PUBLIC_BUILD_SHA: ${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ---- 自检 1：发布前先看 Pages 的发布来源对不对 ----
      # 来源若不是 workflow，deploy 必然失败，站点会变成 "Site not found"。
      # 读不到（权限不足）就跳过，不让检查本身拖累部署。
      - name: Check Pages source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}/pages
        run: |
          code=$(curl -sS -o pages.json -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$API") || code=000
          echo "GET /pages → HTTP $code"
          cat pages.json 2>/dev/null || true
          echo
          if [ "$code" = "200" ]; then
            build_type=$(python3 -c "import json;print(json.load(open('pages.json')).get('build_type',''))" 2>/dev/null || echo '')
            echo "build_type = $build_type"
            if [ "$build_type" != "workflow" ]; then
              echo "::warning title=Pages 发布来源不对::build_type=$build_type。站点会 404，去 Settings → Pages 把 Source 改成 GitHub Actions。"
            fi
          else
            echo "读不到 Pages 配置（非 200），跳过这项检查。"
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ---- 自检 2：发布后真的去访问一次 ----
      # 只回答「访客现在能不能打开」，不等于「构建有没有成功」。
      # 404 / 5xx 视为部署失败；200 但版本没更新只警告（CDN 缓存最长 10 分钟）。
      - name: Verify live site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          WANT_SHA: ${{ github.sha }}
        run: |
          set -u
          url="$SITE_URL"
          case "$url" in */) ;; *) url="$url/" ;; esac
          want="${WANT_SHA:0:7}"
          echo "线上地址：$url"
          echo "期望版本：$want"

          code=""
          got=""
          for i in $(seq 1 10); do
            code=$(curl -s -o home.html -w '%{http_code}' --max-time 20 "$url?cb=$RANDOM$i" || echo 000)
            got=$(grep -o 'name="sr-build" content="[^"]*"' home.html 2>/dev/null | head -1 | sed 's/.*content="//; s/"$//')
            echo "第 $i 次：HTTP $code，线上版本 ${got:-未知}"
            if [ "$code" = "200" ] && [ "$got" = "$want" ]; then break; fi
            # 404 说明 Pages 上没有产物，等再久也不会好，直接进诊断
            if [ "$code" = "404" ]; then break; fi
            sleep 15
          done

          if [ "$code" = "200" ] && [ "$got" = "$want" ]; then
            echo "::notice title=线上自检通过::首页 200，版本 $want 已生效"
            exit 0
          fi

          if [ "$code" = "200" ]; then
            echo "::warning title=线上仍是旧版本::首页返回 200，版本是 ${got:-未知}，期望 $want。多半是 CDN 缓存（最长 10 分钟），稍后刷新确认。"
            exit 0
          fi

          echo "::error title=线上自检失败::首页返回 HTTP $code，站点当前不可访问。"
          if [ "$code" = "404" ]; then
            cat <<'EOF'
          ---- 404 怎么查 ----
          Pages 上没有任何产物，最可能是发布来源被改了：
            1. 打开 Settings → Pages，看 Build and deployment → Source
            2. 必须是 "GitHub Actions"；若显示 "Deploy from a branch" 就改回来
            3. 改完点 Run workflow 重跑本任务
          另一个特征信号：Actions 列表里出现名为 "pages build and deployment"
          的任务，说明 GitHub 正在用 Jekyll 解析 Astro 源码，必然失败。
          EOF
          fi
          exit 1
